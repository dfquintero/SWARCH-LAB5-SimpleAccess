<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio Login</title>
    <script src="https://jsdelivr.net"></script> <!-- Estilos bonitos sin instalar nada -->
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Iniciar Sesión</h2>
    <form id="loginForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Usuario</label>
            <input type="text" id="username" required class="mt-1 block w-full rounded border-gray-300 shadow-sm p-2 border">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Contraseña</label>
            <input type="password" id="password" required class="mt-1 block w-full rounded border-gray-300 shadow-sm p-2 border">
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 font-semibold">Ingresar</button>
    </form>
    <p id="message" class="mt-4 text-center text-sm font-medium"></p>
</div>
<script src="app.js"></script>
</body>
</html>
